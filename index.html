<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Científica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

</head>

<body>
    <div class="container d-flex justify-content-center">
        <div class="calc-card">
            <h5 class="text-center mb-3 text-muted text-uppercase tracking-wider">Calculadora Científica</h5>

            <div id="screen" class="calc-screen">0</div>

            <div class="row g-2">
        
        <div class="col-3"><button class="btn btn-calc btn-scientific w-100" onclick="toggleAngleMode()">DEG/RAD</button></div>
        <div class="col-3"><button class="btn btn-calc btn-scientific w-100" onclick="appendScientific('sin')">sin</button></div>
        <div class="col-3"><button class="btn btn-calc btn-scientific w-100" onclick="appendScientific('cos')">cos</button></div>
        <div class="col-3"><button class="btn btn-calc btn-scientific w-100" onclick="appendScientific('tan')">tan</button></div>
        <div class="col-3"><button class="btn btn-calc btn-scientific w-100" onclick="appendScientific('log')">log</button></div>
        <div class="col-3"><button class="btn btn-calc btn-scientific w-100" onclick="appendScientific('ln')">ln</button></div>
        <div class="col-3"><button class="btn btn-calc btn-scientific w-100" onclick="appendScientific('sqrt')">√</button></div>
        <div class="col-3"><button class="btn btn-calc btn-scientific w-100" onclick="appendOperator('^')">xⁿ</button></div>
        <div class="col-3"><button class="btn btn-calc btn-action w-100" onclick="clearAll()">AC</button></div>
        <div class="col-3"><button class="btn btn-calc btn-action w-100" onclick="deleteLast()">DEL</button></div>
        <div class="col-3"><button class="btn btn-calc btn-scientific w-100" onclick="appendOperator('%')">%</button></div>
        <div class="col-3"><button class="btn btn-calc btn-operator w-100" onclick="appendOperator('÷')">÷</button></div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('7')">7</button></div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('8')">8</button></div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('9')">9</button></div>
        <div class="col-3"><button class="btn btn-calc btn-operator w-100" onclick="appendOperator('×')">×</button></div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('4')">4</button></div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('5')">5</button></div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('6')">6</button></div>
        <div class="col-3"><button class="btn btn-calc btn-operator w-100" onclick="appendOperator('-')">-</button></div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('1')">1</button></div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('2')">2</button></div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('3')">3</button></div>
        <div class="col-3"><button class="btn btn-calc btn-operator w-100" onclick="appendOperator('+')">+</button></div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('0')">0</button></div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('.')">.</button></div>
        <div class="col-3"><button class="btn btn-calc btn-scientific w-100" onclick="appendNumber('π')">π</button></div>
        <div class="col-3"><button class="btn btn-calc btn-equals w-100" onclick="calculate()">=</button></div>
      </div>
    </div>
  </div>
</body>

</html>
