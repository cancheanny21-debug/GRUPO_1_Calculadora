<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Científica</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #080b12, #111827, #07111f);
      color: #ffffff;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    .calc-card {
      width: 100%;
      max-width: 450px;
      padding: 25px;
      background: rgba(24, 28, 38, 0.96);
      border: 1px solid #303746;
      border-radius: 22px;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.6),
        0 0 25px rgba(0, 210, 255, 0.08);
    }

    .calc-card h5 {
      color: #9ba7b8 !important;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .calc-screen {
      width: 100%;
      min-height: 95px;
      margin-bottom: 22px;
      padding: 20px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      overflow: hidden;
      background: #070a0f;
      color: #00ffcc;
      border: 1px solid #2d3645;
      border-radius: 14px;
      box-shadow:
        inset 0 4px 12px rgba(0, 0, 0, 0.8),
        0 0 10px rgba(0, 255, 204, 0.08);
      font-family: "Courier New", monospace;
      font-size: 2rem;
      font-weight: 700;
      text-align: right;
      word-break: break-all;
    }

    .btn-calc {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 11px;
      font-size: 1.05rem;
      font-weight: 600;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.25);
      transition:
        transform 0.15s ease,
        background-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    .btn-calc:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 14px rgba(0, 0, 0, 0.35);
    }

    .btn-calc:active {
      transform: scale(0.94);
    }

    .btn-number {
      background-color: #2a303b;
      color: #ffffff;
    }

    .btn-number:hover {
      background-color: #3a4352;
      color: #ffffff;
    }

    .btn-operator {
      background: linear-gradient(135deg, #ff9d00, #ff6a00);
      color: #ffffff;
    }

    .btn-operator:hover {
      background: linear-gradient(135deg, #ffb02e, #ff7b1a);
      color: #ffffff;
    }

    .btn-scientific {
      background-color: #263747;
      color: #38d9ff;
    }

    .btn-scientific:hover {
      background-color: #314a5f;
      color: #70e5ff;
    }

    .btn-action {
      background-color: #9e2f37;
      color: #ffffff;
    }

    .btn-action:hover {
      background-color: #c03943;
      color: #ffffff;
    }

    .btn-equals {
      background: linear-gradient(135deg, #00d6a3, #00a67e);
      color: #ffffff;
    }

    .btn-equals:hover {
      background: linear-gradient(135deg, #10e8b4, #00be90);
      color: #ffffff;
    }

    @media (max-width: 500px) {
      .container {
        padding: 12px;
      }

      .calc-card {
        padding: 18px;
        border-radius: 18px;
      }

      .calc-screen {
        min-height: 80px;
        padding: 15px;
        font-size: 1.6rem;
      }

      .btn-calc {
        height: 48px;
        font-size: 0.9rem;
      }
    }
  </style>

</head>

<body>
  <div class="container d-flex justify-content-center">
    <div class="calc-card">
      <h5 class="text-center mb-3 text-muted text-uppercase tracking-wider">Calculadora Científica</h5>

      <div id="screen" class="calc-screen">0</div>

      <div class="row g-2">

        <div class="col-3"><button class="btn btn-calc btn-scientific w-100"
            onclick="toggleAngleMode()">DEG/RAD</button></div>
        <div class="col-3"><button class="btn btn-calc btn-scientific w-100"
            onclick="appendScientific('sin')">sin</button></div>
        <div class="col-3"><button class="btn btn-calc btn-scientific w-100"
            onclick="appendScientific('cos')">cos</button></div>
        <div class="col-3"><button class="btn btn-calc btn-scientific w-100"
            onclick="appendScientific('tan')">tan</button></div>
        <div class="col-3"><button class="btn btn-calc btn-scientific w-100"
            onclick="appendScientific('log')">log</button></div>
        <div class="col-3"><button class="btn btn-calc btn-scientific w-100"
            onclick="appendScientific('ln')">ln</button></div>
        <div class="col-3"><button class="btn btn-calc btn-scientific w-100"
            onclick="appendScientific('sqrt')">√</button></div>
        <div class="col-3"><button class="btn btn-calc btn-scientific w-100" onclick="appendOperator('^')">xⁿ</button>
        </div>
        <div class="col-3"><button class="btn btn-calc btn-action w-100" onclick="clearAll()">AC</button></div>
        <div class="col-3"><button class="btn btn-calc btn-action w-100" onclick="deleteLast()">DEL</button></div>
        <div class="col-3"><button class="btn btn-calc btn-scientific w-100" onclick="appendOperator('%')">%</button>
        </div>
        <div class="col-3"><button class="btn btn-calc btn-operator w-100" onclick="appendOperator('÷')">÷</button>
        </div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('7')">7</button></div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('8')">8</button></div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('9')">9</button></div>
        <div class="col-3"><button class="btn btn-calc btn-operator w-100" onclick="appendOperator('×')">×</button>
        </div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('4')">4</button></div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('5')">5</button></div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('6')">6</button></div>
        <div class="col-3"><button class="btn btn-calc btn-operator w-100" onclick="appendOperator('-')">-</button>
        </div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('1')">1</button></div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('2')">2</button></div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('3')">3</button></div>
        <div class="col-3"><button class="btn btn-calc btn-operator w-100" onclick="appendOperator('+')">+</button>
        </div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('0')">0</button></div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('.')">.</button></div>
        <div class="col-3"><button class="btn btn-calc btn-scientific w-100" onclick="appendNumber('π')">π</button>
        </div>
        <div class="col-3"><button class="btn btn-calc btn-equals w-100" onclick="calculate()">=</button></div>
      </div>
    </div>
  </div>
</body>

</html>
