<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Científica</title>

</head>

<body>
  <div class="container d-flex justify-content-center">
    <div class="calc-card">
      <h5 class="text-center mb-3 text-muted text-uppercase tracking-wider">Calculadora Científica</h5>

      <div id="screen" class="calc-screen">0</div>

      <div class="row g-2">

        <div class="col-3"><button class="btn btn-calc btn-scientific w-100"
            onclick="toggleAngleMode()">DEG/RAD</button></div>
        <div class="col-3"><button class="btn btn-calc btn-scientific w-100"
            onclick="appendScientific('sin')">sin</button></div>
        <div class="col-3"><button class="btn btn-calc btn-scientific w-100"
            onclick="appendScientific('cos')">cos</button></div>
        <div class="col-3"><button class="btn btn-calc btn-scientific w-100"
            onclick="appendScientific('tan')">tan</button></div>
        <div class="col-3"><button class="btn btn-calc btn-scientific w-100"
            onclick="appendScientific('log')">log</button></div>
        <div class="col-3"><button class="btn btn-calc btn-scientific w-100"
            onclick="appendScientific('ln')">ln</button></div>
        <div class="col-3"><button class="btn btn-calc btn-scientific w-100"
            onclick="appendScientific('sqrt')">√</button></div>
        <div class="col-3"><button class="btn btn-calc btn-scientific w-100" onclick="appendOperator('^')">xⁿ</button>
        </div>
        <div class="col-3"><button class="btn btn-calc btn-action w-100" onclick="clearAll()">AC</button></div>
        <div class="col-3"><button class="btn btn-calc btn-action w-100" onclick="deleteLast()">DEL</button></div>
        <div class="col-3"><button class="btn btn-calc btn-scientific w-100" onclick="appendOperator('%')">%</button>
        </div>
        <div class="col-3"><button class="btn btn-calc btn-operator w-100" onclick="appendOperator('÷')">÷</button>
        </div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('7')">7</button></div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('8')">8</button></div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('9')">9</button></div>
        <div class="col-3"><button class="btn btn-calc btn-operator w-100" onclick="appendOperator('×')">×</button>
        </div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('4')">4</button></div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('5')">5</button></div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('6')">6</button></div>
        <div class="col-3"><button class="btn btn-calc btn-operator w-100" onclick="appendOperator('-')">-</button>
        </div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('1')">1</button></div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('2')">2</button></div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('3')">3</button></div>
        <div class="col-3"><button class="btn btn-calc btn-operator w-100" onclick="appendOperator('+')">+</button>
        </div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('0')">0</button></div>
        <div class="col-3"><button class="btn btn-calc btn-number w-100" onclick="appendNumber('.')">.</button></div>
        <div class="col-3"><button class="btn btn-calc btn-scientific w-100" onclick="appendNumber('π')">π</button>
        </div>
        <div class="col-3"><button class="btn btn-calc btn-equals w-100" onclick="calculate()">=</button></div>
      </div>
    </div>
  </div>
  <script>
    const screen = document.getElementById("screen");
    let isResultEvaluated = false;


    function appendNumber(value) {
      const valToAppend = value === "π" ? Math.PI.toFixed(6) : value;

      if (screen.innerText === "0" || screen.innerText === "Error" || isResultEvaluated) {
        if (value === ".") {
          screen.innerText = "0.";
        } else {
          screen.innerText = valToAppend;
        }
        isResultEvaluated = false;
      } else {
        const lastNum = screen.innerText.split(/[\+\-\×\÷\^%]/).pop();
        if (value === "." && lastNum.includes(".")) return;

        screen.innerText += valToAppend;
      }
    }


    function appendOperator(op) {
      if (screen.innerText === "Error") return;
      isResultEvaluated = false;
      const lastChar = screen.innerText.slice(-1);

      if (["+", "-", "×", "÷", "^", "%"].includes(lastChar)) {
        screen.innerText = screen.innerText.slice(0, -1) + op;
      } else {
        screen.innerText += op;
      }
    }


    function appendScientific(fn) {
      if (screen.innerText === "Error") return;
      try {
        let currentVal = parseFloat(evaluarExpresion(screen.innerText));

        if (isNaN(currentVal)) return;

        let result = 0;
        switch (fn) {
          case "sqrt":
            if (currentVal < 0) throw new Error("Raíz negativa");
            result = Math.sqrt(currentVal);
            break;
          case "log":
            if (currentVal <= 0) throw new Error("Log no válido");
            result = Math.log10(currentVal);
            break;
          case "ln":
            if (currentVal <= 0) throw new Error("Ln no válido");
            result = Math.log(currentVal);
            break;
        }

        screen.innerText = Number.isInteger(result) ? result : parseFloat(result.toFixed(8));
        isResultEvaluated = true;
      } catch (error) {
        screen.innerText = "Error";
        isResultEvaluated = true;
      }
    }


    function clearAll() {
      screen.innerText = "0";
      isResultEvaluated = false;
    }


    function deleteLast() {
      if (isResultEvaluated || screen.innerText.length === 1 || screen.innerText === "Error") {
        screen.innerText = "0";
        isResultEvaluated = false;
      } else {
        screen.innerText = screen.innerText.slice(0, -1);
      }
    }


    function evaluarExpresion(expr) {
      return expr
        .replace(/×/g, "*")
        .replace(/÷/g, "/")
        .replace(/\^/g, "**")
        .replace(/%/g, "/100");
    }


    function calculate() {
      if (screen.innerText === "Error") return;
      try {
        let rawExpr = screen.innerText;
        let expr = evaluarExpresion(rawExpr);

        let res = Function(`"use strict"; return (${expr})`)();

        if (!isFinite(res) || isNaN(res)) {
          screen.innerText = "Error";
        } else {
          screen.innerText = Number.isInteger(res) ? res : parseFloat(res.toFixed(8));
        }
      } catch (e) {
        screen.innerText = "Error";
      }
      isResultEvaluated = true;
    }
  </script>
</body>

</html>
